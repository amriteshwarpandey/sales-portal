name: sales-portal

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/salesportal
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      EMAIL: ${EMAIL:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      HR_EMAIL: ${HR_EMAIL:-}
      MASTER_ADMIN_EMAIL: ${MASTER_ADMIN_EMAIL:-master@salesportal.local}
      MASTER_ADMIN_PASSWORD: ${MASTER_ADMIN_PASSWORD:-Master@12345}
    ports:
      - "${API_PORT:-5000}:5000"

  client:
    build:
      context: ./client
      args:
        API_URL: http://server:5000
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:-http://localhost:5000}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-3000}:3000"

volumes:
  mongo-data:
